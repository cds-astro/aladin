name: Android Continuous Build

# Compila el APK de debug en cada push a master y lo publica como pre-release
# en GitHub Releases. No usa un número de versión en el nombre del tag/release
# (sería manual y se desincroniza rápido); en su lugar usa el SHA corto del
# commit, que es único por build y no pisa releases anteriores.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-continuous-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AladinAndroid
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Compute build identifiers
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=continuous-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../dist/Aladin-${{ steps.meta.outputs.short_sha }}.apk"

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Continuous build ${{ steps.meta.outputs.short_sha }}"
          body: |
            Automated debug build from commit ${{ github.sha }}.
            Not a tagged release — installable APK for testing.
          prerelease: true
          make_latest: true
          files: dist/Aladin-${{ steps.meta.outputs.short_sha }}.apk
